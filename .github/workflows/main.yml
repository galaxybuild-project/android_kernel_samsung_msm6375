name: CI
on:
  workflow_dispatch:
jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-20.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/galaxybuild-project/android_kernel_samsung_msm6375
          kernel-branch: next-susfs
          config: a23xq_eur_open_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 14
          aosp-clang-version: r383902b1
